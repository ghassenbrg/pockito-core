# Server Configuration
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:Pockito}
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Database Configuration (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/pockito}
    username: ${SPRING_DATASOURCE_USERNAME:pockito}
    password: ${SPRING_DATASOURCE_PASSWORD:pockito}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
  
  # Flyway Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
  
  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://auth.ghassen.io/realms/pockito}
          jwk-set-uri: ${KEYCLOAK_AUTH_SERVER_URL:https://auth.ghassen.io}/realms/pockito/protocol/openid-connect/certs

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pockito.ghassen.io,http://localhost:4200}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}

# Logging Configuration
logging:
  level:
    # Root logging level
    root: ${LOGGING_LEVEL_ROOT:INFO}
    
    # Application specific logging
    io.ghassen.pockito: ${LOGGING_LEVEL_IO_GHASSEN_POCKITO:DEBUG}
    
    # Spring Framework logging
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: ${LOGGING_LEVEL_REQUEST_MAPPING:INFO}
    org.springframework.web.servlet.DispatcherServlet: ${LOGGING_LEVEL_DISPATCHER_SERVLET:INFO}
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerAdapter: ${LOGGING_LEVEL_REQUEST_MAPPING_HANDLER_ADAPTER:INFO}
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ${LOGGING_LEVEL_EXCEPTION_HANDLER:INFO}
    
    # Spring Boot logging
    org.springframework.boot: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT:INFO}
    org.springframework.boot.autoconfigure: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_AUTOCONFIGURE:INFO}
    
    # Spring Data JPA/Hibernate logging
    org.springframework.data.jpa: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_JPA:INFO}
    org.springframework.orm.jpa: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_ORM_JPA:INFO}
    org.hibernate: ${LOGGING_LEVEL_ORG_HIBERNATE:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_ORG_HIBERNATE_BASIC_BINDER:INFO}
    org.hibernate.type.descriptor.sql.BasicExtractor: ${LOGGING_LEVEL_ORG_HIBERNATE_BASIC_EXTRACTOR:INFO}
    org.hibernate.engine.transaction: ${LOGGING_LEVEL_ORG_HIBERNATE_ENGINE_TRANSACTION:INFO}
    
    # Database connection logging
    org.springframework.jdbc: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC:INFO}
    org.springframework.jdbc.core: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE:INFO}
    org.springframework.jdbc.datasource: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_DATASOURCE:INFO}
    
    # Security logging
    org.springframework.security.oauth2: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2:INFO}
    org.springframework.security.oauth2.jwt: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_JWT:INFO}
    org.springframework.security.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB:INFO}
    org.springframework.security.web.authentication: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB_AUTHENTICATION:INFO}
    org.springframework.security.web.access: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB_ACCESS:INFO}
    org.springframework.security.web.access.intercept: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB_ACCESS_INTERCEPT:INFO}
    
    # Keycloak logging
    org.keycloak: ${LOGGING_LEVEL_ORG_KEYCLOAK:INFO}
    
    # OpenAPI/Swagger logging
    org.springdoc: ${LOGGING_LEVEL_ORG_SPRINGDOC:INFO}
    
    # Flyway logging
    org.flywaydb: ${LOGGING_LEVEL_ORG_FLYWAYDB:INFO}
    
    # HTTP client logging
    org.apache.http: ${LOGGING_LEVEL_ORG_APACHE_HTTP:INFO}
    org.apache.http.wire: ${LOGGING_LEVEL_ORG_APACHE_HTTP_WIRE:INFO}
    org.apache.http.headers: ${LOGGING_LEVEL_ORG_APACHE_HTTP_HEADERS:INFO}
    
    # Jackson JSON processing
    com.fasterxml.jackson: ${LOGGING_LEVEL_COM_Fasterxml_JACKSON:INFO}
    
    # Validation logging
    org.springframework.validation: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_VALIDATION:INFO}
    org.springframework.web.bind.MethodArgumentNotValidException: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_BIND_METHOD_ARGUMENT_NOT_VALID_EXCEPTION:INFO}
    
    # CORS logging
    org.springframework.web.cors: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_CORS:INFO}
    
    # Actuator logging
    org.springframework.boot.actuate: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_ACTUATE:INFO}
    
    # MapStruct logging
    org.mapstruct: ${LOGGING_LEVEL_ORG_MAPSTRUCT:INFO}
    
    # Tomcat logging
    org.apache.catalina: ${LOGGING_LEVEL_ORG_APACHE_CATALINA:INFO}
    org.apache.coyote: ${LOGGING_LEVEL_ORG_APACHE_COYOTE:INFO}
    org.apache.tomcat: ${LOGGING_LEVEL_ORG_APACHE_TOMCAT:INFO}
    
    # Connection pool logging
    com.zaxxer.hikari: ${LOGGING_LEVEL_COM_ZAXXER_HIKARI:INFO}
  
  # Logging pattern configuration
  pattern:
    console: ${LOGGING_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n}
    file: ${LOGGING_PATTERN_FILE:%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n}
  
  # File logging configuration
  file:
    name: ${LOGGING_FILE_NAME:logs/pockito.log}
    max-size: ${LOGGING_FILE_MAX_SIZE:100MB}
    max-history: ${LOGGING_FILE_MAX_HISTORY:30}
    total-size-cap: ${LOGGING_FILE_TOTAL_SIZE_CAP:1GB}
  
  # Console logging configuration
  console:
    enabled: ${LOGGING_CONSOLE_ENABLED:true}
